server {
    listen 80;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://clubcycle:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger UI Proxies (Handling internal redirects)
    location /docs {
        proxy_pass http://clubcycle:8080/docs;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://clubcycle:8080/swagger-ui/;
        proxy_set_header Host $host;
    }
    
    location /v3/api-docs {
        proxy_pass http://clubcycle:8080/v3/api-docs;
        proxy_set_header Host $host;
    }
}
